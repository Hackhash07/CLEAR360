name: Reconstruction Quality QA

on:
  push:
    branches:
      - feature/universal-reconstruction-qa
    paths:
      - "pyproject.toml"
      - "requirements.txt"
      - "photo_reconstruction/__init__.py"
      - "photo_reconstruction/image_loader.py"
      - "photo_reconstruction/tests/test_phone_reconstruction.py"
      - "photo_reconstruction/image_preparation.py"
      - "photo_reconstruction/camera_calibration.py"
      - "photo_reconstruction/sfm_engine.py"
      - "photo_reconstruction/quality_report.py"
      - "photo_reconstruction/tests/test_camera_calibration.py"
      - "photo_reconstruction/tests/test_image_preparation.py"
      - "photo_reconstruction/reconstruction_qa.py"
      - "photo_reconstruction/openmvs_backend.py"
      - "photo_reconstruction/quality_report.py"
      - "photo_reconstruction/pipeline.py"
      - "viewer/phone_panel.py"
      - "photo_reconstruction/coverage_diagnostics.py"
      - "photo_reconstruction/exif_reader.py"
      - "photo_reconstruction/image_quality.py"
      - "photo_reconstruction/tests/test_image_quality_normalization.py"
      - "photo_reconstruction/photo_set_auditor.py"
      - "photo_reconstruction/tests/test_photo_set_auditor.py"
      - "photo_reconstruction/tests/test_reconstruction_qa.py"
      - "photo_reconstruction/tests/test_openmvs_backend.py"
      - "photo_reconstruction/tests/test_openmvs_quality.py"
      - ".github/workflows/reconstruction-qa.yml"
  pull_request:
    paths:
      - "pyproject.toml"
      - "requirements.txt"
      - "photo_reconstruction/__init__.py"
      - "photo_reconstruction/image_preparation.py"
      - "photo_reconstruction/tests/test_image_preparation.py"
      - "photo_reconstruction/image_loader.py"
      - "photo_reconstruction/tests/test_phone_reconstruction.py"
      - "photo_reconstruction/reconstruction_qa.py"
      - "photo_reconstruction/openmvs_backend.py"
      - "photo_reconstruction/quality_report.py"
      - "photo_reconstruction/pipeline.py"
      - "viewer/phone_panel.py"
      - "photo_reconstruction/coverage_diagnostics.py"
      - "photo_reconstruction/exif_reader.py"
      - "photo_reconstruction/photo_set_auditor.py"
      - "photo_reconstruction/tests/test_photo_set_auditor.py"
      - "photo_reconstruction/tests/test_reconstruction_qa.py"
      - "photo_reconstruction/tests/test_openmvs_backend.py"
      - "photo_reconstruction/tests/test_openmvs_quality.py"
      - ".github/workflows/reconstruction-qa.yml"

jobs:
  reconstruction-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install focused QA dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy scipy trimesh pytest pillow pillow-heif opencv-python-headless

      - name: Compile integrated reconstruction modules
        run: |
          python -m py_compile \
            photo_reconstruction/__init__.py \
            photo_reconstruction/image_loader.py \
            photo_reconstruction/image_preparation.py \
            photo_reconstruction/camera_calibration.py \
            photo_reconstruction/image_loader.py \
            photo_reconstruction/sfm_engine.py \
            photo_reconstruction/exif_reader.py \
            photo_reconstruction/photo_set_auditor.py \
            photo_reconstruction/reconstruction_qa.py \
            photo_reconstruction/quality_report.py \
            photo_reconstruction/pipeline.py \
            photo_reconstruction/openmvs_backend.py \
            viewer/phone_panel.py

      - name: Run reconstruction QA and OpenMVS contract tests
        run: |
          python -m pytest -q \
            photo_reconstruction/tests/test_reconstruction_qa.py \
            photo_reconstruction/tests/test_openmvs_backend.py \
            photo_reconstruction/tests/test_openmvs_quality.py \
            photo_reconstruction/tests/test_coverage_diagnostics.py \
            photo_reconstruction/tests/test_photo_set_auditor.py \
            photo_reconstruction/tests/test_image_quality_normalization.py \
            photo_reconstruction/tests/test_image_preparation.py \
            photo_reconstruction/tests/test_camera_calibration.py
