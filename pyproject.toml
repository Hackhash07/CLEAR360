[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "clear360"
version = "0.1.0"
description = "Real-Time 3D Automotive Surroundings Reconstruction"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "torch>=2.3",
    "torchvision>=0.18",
    "transformers>=4.41",
    "opencv-python>=4.10",
    "open3d>=0.18",
    "numpy>=1.26",
    "scipy>=1.13",
    "PySide6>=6.7",
    "vispy>=0.17.0",
    "PyYAML>=6.0",
    "Pillow>=10.3",
    "OpenEXR>=3.2",
    "trimesh>=4.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "black>=24.0",
    "mypy>=1.10",
    "ruff>=0.4",
]

[tool.setuptools.packages.find]
where = ["."]
exclude = ["data*", "weights*", "assets*", "docs*", "scripts*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = [
    "pipeline/tests",
    "depth/tests",
    "pointcloud/tests",
    "fusion/tests",
    "scene/tests",
    "obstacles/tests",
    "viewer/tests",
    "photo_reconstruction/tests",
    "validation/",
]
python_files = ["test_*.py"]
addopts = "-v --tb=short"

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
